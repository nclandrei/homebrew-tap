name: Refresh Snapshot Formulas

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
    inputs:
      window_hours:
        description: Refresh only formulas whose upstream HEAD commit is newer than this many hours
        default: "24"
        required: false
      force_all:
        description: Refresh every formula regardless of commit age
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: refresh-snapshot-formulas
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest

    steps:
      - name: Check out tap
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Refresh formulas from upstream snapshots
        env:
          GITHUB_TOKEN: ${{ github.token }}
          WINDOW_HOURS: ${{ github.event.inputs.window_hours || '24' }}
          FORCE_ALL: ${{ github.event.inputs.force_all || 'false' }}
        run: |
          if [[ "$FORCE_ALL" == "true" ]]; then
            python3 scripts/update_snapshot_formulas.py --all --summary-path "$GITHUB_STEP_SUMMARY"
          else
            python3 scripts/update_snapshot_formulas.py --window-hours "$WINDOW_HOURS" --summary-path "$GITHUB_STEP_SUMMARY"
          fi

      - name: Verify formula syntax
        run: |
          for file in Formula/*.rb; do
            ruby -c "$file"
          done

      - name: Commit refreshed formulas
        run: |
          if git diff --quiet; then
            echo "No snapshot updates were needed."
            exit 0
          fi

          changed_formulas="$(git diff --name-only -- Formula | sed 's#^Formula/##; s#\\.rb$##' | paste -sd ', ' -)"
          git config user.name "Andrei Nicolae"
          git config user.email "andrei@nicolaeandrei.com"
          git add Formula
          git commit -m "chore: refresh snapshot formulas (${changed_formulas})"
          git push
